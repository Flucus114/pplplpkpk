
name: Build Devourer of the Void

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: devourervoid

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compilar mod
        run: gradle build --no-daemon

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Devourer-of-the-Void-1.20.1
          path: devourervoid/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
